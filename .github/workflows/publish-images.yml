name: Publish Studio Gallery images
on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:
permissions:
  contents: read
  packages: write
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/metadata-action@v5
        id: meta-api
        with:
          images: ghcr.io/${{ github.repository_owner }}/studio-gallery-api
          tags: type=raw,value=latest
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: backend/Dockerfile
          push: true
          tags: ${{ steps.meta-api.outputs.tags }}
      - uses: docker/metadata-action@v5
        id: meta-web
        with:
          images: ghcr.io/${{ github.repository_owner }}/studio-gallery-web
          tags: type=raw,value=latest
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: frontend/Dockerfile
          push: true
          tags: ${{ steps.meta-web.outputs.tags }}
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build SPK
        run: |
          set -e
          mkdir -p stage/conf stage/scripts stage/var/deploy
          cp synology/INFO stage/INFO
          cp synology/conf/privilege stage/conf/
          cp synology/scripts/* stage/scripts/
          cp docker-compose.registry.yml stage/var/docker-compose.yml
          cp deploy/nginx.conf stage/var/deploy/nginx.conf
          # DSM expects classic USTAR archives; GNU tar defaults to pax on
          # newer runners, which Package Center rejects as an invalid SPK.
          tar --format=ustar -czf stage/package.tgz -C stage/var .
          rm -rf stage/var
          tar --format=ustar -cf StudioGallery-0.1.0-3-noarch.spk -C stage INFO conf scripts package.tgz
      - uses: actions/upload-artifact@v4
        with:
          name: StudioGallery-0.1.0-3-noarch
          path: StudioGallery-0.1.0-3-noarch.spk
